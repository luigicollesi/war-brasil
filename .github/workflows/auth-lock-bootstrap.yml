name: Auth Lock Bootstrap

on:
  pull_request:
    branches:
      - dev
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/auth-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(auth): refresh package lock"
          git push origin HEAD:${{ github.head_ref }}
