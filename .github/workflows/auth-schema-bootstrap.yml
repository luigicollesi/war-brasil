name: Auth Schema Bootstrap

on:
  pull_request:
    branches:
      - dev
    paths:
      - src/lib/server/auth/**
      - package.json
      - package-lock.json
      - .github/workflows/auth-schema-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-auth-schema:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: war
          POSTGRES_PASSWORD: war
          POSTGRES_DB: war_auth_schema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U war -d war_auth_schema"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://war:war@127.0.0.1:5432/war_auth_schema
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create isolated auth schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS auth;'
      - name: Generate Better Auth 1.7.4 SQL
        run: npx --yes auth@1.7.4 generate --config src/lib/server/auth/schema-config.ts --output /tmp/better-auth-schema.sql --yes
      - name: Build managed migration
        run: |
          {
            echo '-- Better Auth 1.7.4 core schema for War-Brasil.'
            echo '-- Generated from src/lib/server/auth/schema-config.ts; regenerate before changing the Better Auth core shape.'
            echo 'CREATE SCHEMA IF NOT EXISTS auth;'
            echo 'SET search_path TO auth;'
            cat /tmp/better-auth-schema.sql
            echo 'RESET search_path;'
          } > src/lib/db/migrations/managed/031-auth-foundation.sql
      - name: Commit migration when needed
        run: |
          if git diff --quiet -- src/lib/db/migrations/managed/031-auth-foundation.sql && git ls-files --error-unmatch src/lib/db/migrations/managed/031-auth-foundation.sql >/dev/null 2>&1; then
            echo 'Auth migration already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db/migrations/managed/031-auth-foundation.sql
          git commit -m 'feat(auth): add generated Better Auth schema'
          git push origin HEAD:${{ github.head_ref }}
