name: Cloudflare Build

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: cloudflare-build
  cancel-in-progress: true

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Cloudflare deployment contract tests
        run: node --test tests/cloudflare-deployment-config.test.mjs tests/cloudflare-next-middleware-patch.test.mjs
      - name: Validate installed Next workaround
        run: npm run cloudflare:check-next-patch
      - name: Build and verify OpenNext worker
        run: npm run cloudflare:build
