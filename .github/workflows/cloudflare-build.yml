name: Cloudflare Build

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches:
      - dev
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-build
  cancel-in-progress: true

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Cloudflare deployment contract tests
        run: node --test tests/cloudflare-deployment-config.test.mjs tests/cloudflare-next-middleware-patch.test.mjs tests/cloudflare-realtime-durable-object.test.mjs
      - name: Build Durable Object realtime Worker
        run: npm run cloudflare:realtime:build
      - name: Build automation Queue Worker
        run: npm run cloudflare:automation:build
      - name: Validate installed Next workaround
        run: npm run cloudflare:check-next-patch
      - name: Build and verify OpenNext worker
        run: npm run cloudflare:build
