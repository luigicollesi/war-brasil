name: Doctrine E2E

on:
  pull_request:
    branches:
      - dev
    paths:
      - "src/app/rules/**"
      - "src/components/doctrine/**"
      - "src/components/pre-game/foundation/**"
      - "src/lib/doctrine-presentation.ts"
      - "tests/e2e/doctrine.spec.mjs"
      - ".github/workflows/doctrine-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctrine-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://war:war@127.0.0.1:5432/war_ci
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
      DOCTRINE_EVIDENCE_DIR: test-results/doctrine-evidence

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright harness
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start production application
        run: |
          npm run start -- -p 3000 > /tmp/doctrine-next.log 2>&1 &
          echo $! > /tmp/doctrine-next.pid

      - name: Wait for application
        run: |
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/rules >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/doctrine-next.log
          exit 1

      - name: Run Doctrine browser gates
        run: npx playwright test tests/e2e/doctrine.spec.mjs --workers=1 --reporter=line

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/doctrine-next.log || true

      - name: Upload Doctrine evaluation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: doctrine-eval-evidence
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
