name: Test

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: war
          POSTGRES_PASSWORD: war
          POSTGRES_DB: war_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U war -d war_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix realtime ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Audit realtime dependencies
        run: npm --prefix realtime audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - name: Test database migrations
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://war:war@127.0.0.1:5432/war_ci
      - run: npm run realtime:test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://war:war@127.0.0.1:5432/war_ci
