name: Test

on:
  pull_request:
    branches:
      - feat/event-system-phase-1
      - feat/event-system-phase-2
      - feat/event-system-phase-3
  push:
    branches:
      - feat/event-system-phase-2
      - feat/event-system-phase-3
      - feat/event-system-phase-4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
