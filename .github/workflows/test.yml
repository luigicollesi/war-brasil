name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/mobile-card-hand-drawer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
