name: Test

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix realtime ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Audit realtime dependencies
        run: npm --prefix realtime audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run realtime:test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://war:war@127.0.0.1:5432/war_ci
